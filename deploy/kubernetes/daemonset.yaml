# DaemonSet for GPU Economic Telemetry Agent. Schedule on GPU nodes only (nodeSelector).
# Requires NODE_NAME env (downward API) for node_id when config has node_id: auto.
# Mount host /dev and /proc so the agent can access NVML and optional process attribution.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-econ-agent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: gpu-econ-agent
  template:
    metadata:
      labels:
        app: gpu-econ-agent
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      hostPID: true
      containers:
        - name: agent
          image: your-registry/gpu-econ-agent:latest
          args:
            - "-config"
            - "/etc/gpu-econ-agent/config.yaml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: config
              mountPath: /etc/gpu-econ-agent
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: proc
          hostPath:
            path: /proc
        - name: config
          configMap:
            name: gpu-econ-agent-config
